# Trivial-tier CI on Buildkite: foundation gates only (parity with the
# `checks`, `skill-validate`, and `verify-routes` jobs in
# .github/workflows/_checks.yml). FPC agents run --no-command-eval, so every  # guard:allow plain-English word, not a repo reference
# step's command is exactly one checked-in script path with no arguments
# (wave-monitor PR #108 pattern). Host-injected GUARD_PRIVATE_REPOS arrives
# by step key on queue fpc-isolated-secrets for guard-content-policy
# (Buildkite runbook); no other secrets, no plugins, no interpolation.
# That step's `if` is exactly:
#   build.branch == pipeline.default_branch && (build.source == "schedule" || build.source == "webhook" || build.source == "api" || build.source == "ui") && build.pull_request.id == null && build.tag == null
# A schedule on any other branch does not match. The check step takes no
# secrets and has no `if`. check-secret-queue-fence.sh fails the build if
# that condition is missing or followed by more logic.
# Retry matches PR #108: automatic retry on agent loss only, never on failure.
# Ordering is load-bearing (WAVE-26506, vendored from wave-monitor 796755b):
# the two leak guards are the first two command steps, each followed by a
# `wait` barrier, so every secret-bearing step topologically depends on BOTH
# guards. Do not remove a barrier or move a secrets step above one without
# updating .buildkite/tests/pipeline-gating.py.
steps:
  - label: ":key: guard gitleaks"
    key: guard-gitleaks
    command: .buildkite/scripts/guard-gitleaks.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 10
    retry: &retry-agent-loss
      automatic:
        - exit_status: -1
          limit: 1
        - signal_reason: agent_stop
          limit: 1
      manual:
        allowed: true
        permit_on_passed: false

  - wait

  - label: ":clipboard: guard content-policy"
    key: guard-content-policy
    command: .buildkite/scripts/guard-content-policy.sh
    # Default branch, and only schedule, webhook, api, or ui. A schedule on
    # any other branch does not match. No extra logic after this condition.
    if: 'build.branch == pipeline.default_branch && (build.source == "schedule" || build.source == "webhook" || build.source == "api" || build.source == "ui") && build.pull_request.id == null && build.tag == null'
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated-secrets
    timeout_in_minutes: 10
    retry: *retry-agent-loss

  - wait

  - label: ":lock: check secret-queue fence"
    key: check-secret-queue-fence
    command: .buildkite/scripts/check-secret-queue-fence.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 5
    retry:
      automatic:
        - exit_status: -1
          limit: 1

  - label: ":mag: foundation secret-scan"
    key: foundation-secret-scan
    command: .buildkite/scripts/foundation-secret-scan.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1
          limit: 1

  - label: ":straight_ruler: foundation file-size gate"
    key: foundation-file-size
    command: .buildkite/scripts/foundation-file-size.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1
          limit: 1

  - label: ":scroll: foundation skill-validate"
    key: foundation-skill-validate
    command: .buildkite/scripts/foundation-skill-validate.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 5
    retry:
      automatic:
        - exit_status: -1
          limit: 1

  - label: ":globe_with_meridians: foundation verify-routes"
    key: foundation-verify-routes
    command: .buildkite/scripts/foundation-verify-routes.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 5
    retry:
      automatic:
        - exit_status: -1
          limit: 1

  - wait

  # O1 (WAVE-26520): provenance-emit runs last behind its own barrier so a
  # failed earlier step cannot emit. Queue fpc-isolated: this step receives
  # NO secrets, names only. When the secret-queue fence skips
  # guard-content-policy, the manifest records that step as not run.
  - label: ":scroll: provenance emit (O1)"
    key: provenance-emit
    command: .buildkite/scripts/provenance-emit.sh
    agents:  # guard:allow BK pipeline keyword, not a repo reference
      queue: fpc-isolated
    timeout_in_minutes: 5
    retry:
      automatic:
        - exit_status: -1
          limit: 1
